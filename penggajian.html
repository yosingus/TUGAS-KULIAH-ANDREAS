<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Input Penggajian</title><style>body{font:15px Arial;padding:20px;color:#263247}h2{color:#173d70}label{display:block;margin:13px 0 5px;font-weight:bold}input,select{display:block;width:100%;max-width:520px;padding:9px;border:1px solid #aaa;border-radius:4px}button{margin-top:18px;padding:10px 18px;background:#245b9d;color:white;border:0;border-radius:4px}</style></head><body><h2>Form Input Penggajian Karyawan</h2><p>Lengkapi tujuh data berikut.</p><form onsubmit="event.preventDefault();alert('Berhasil diisi. Ini simulasi, data belum disimpan ke database.');this.reset()"><label>1. Nomor Induk Karyawan</label><input required placeholder="Contoh: KRY001"><label>2. Nama Karyawan</label><input required placeholder="Nama lengkap"><label>3. Jabatan</label><select required><option value="">Pilih jabatan</option><option>Staff</option><option>Supervisor</option><option>Manager</option></select><label>4. Bulan Penggajian</label><select required><option value="">Pilih bulan</option><option>Januari</option><option>Februari</option><option>Maret</option><option>April</option><option>Mei</option><option>Juni</option><option>Juli</option><option>Agustus</option><option>September</option><option>Oktober</option><option>November</option><option>Desember</option></select><label>5. Gaji Pokok (Rp)</label><input type="number" min="0" required><label>6. Tunjangan (Rp)</label><input type="number" min="0" required><label>7. Potongan (Rp)</label><input type="number" min="0" required><button type="submit">Kirim Data</button></form></body></html>
